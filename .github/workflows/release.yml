name: release

# Release notes are versioned before the tag is cut. The workflow reads that
# exact entry and never writes back to the repository, so a release cannot add
# a second changelog heading after the immutable module version already exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # The archive is tested as CI tests the branch: the conformance suite
    # serves the application over a database of its own, and with CI set a
    # suite without one fails instead of skipping.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: permission_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Verify the exact tag archive
        env:
          TAG: ${{ github.ref_name }}
          ARANDU_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/permission_test?sslmode=disable
          ARANDU_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/permission_test?sslmode=disable
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$TAG")"
          archive="$RUNNER_TEMP/package-permission"
          mkdir -p "$archive"
          git archive "$TAG" | tar -x -C "$archive"
          cd "$archive"
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
          GOWORK=off go build ./...
          GOWORK=off go vet ./...
          # configure.go is not vetted here. It carries a build tag, so it is
          # not part of ./..., and the template deletes it once a clone has been
          # configured -- naming it makes the archive check fail on every module
          # that did what the template asks.
          GOWORK=off go test -race -count=1 ./...

      - name: Audit known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          GOWORK=off govulncheck ./...

      - name: Publish the pre-versioned changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          heading="## [$version] - "
          count=$(grep -cF "$heading" CHANGELOG.md || true)
          if [ "$count" -ne 1 ]; then
            echo "CHANGELOG.md must contain exactly one pre-versioned $TAG entry"
            exit 1
          fi

          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="$heading" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "the pre-versioned $TAG entry has no release notes"
            exit 1
          fi

          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file "$notes"
